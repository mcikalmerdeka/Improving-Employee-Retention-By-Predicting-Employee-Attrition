[project]
name = "improving-employee-retention-by-predicting-employee-attrition-using-machine-learning"
version = "0.1.0"
description = "Employee attrition classification notebook and Streamlit app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=5.5.0",
    "category-encoders>=2.11.2",
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "streamlit>=1.55.0",
    "tqdm>=4.67.3",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.10.2",
    "nbconvert>=7.16.6",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
